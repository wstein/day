name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: "1.22"
      - name: Build static binaries
        run: |
          set -eu
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}
            d=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$d/day" .
            tar -C "$d" -czf "dist/day_${v}_${os}_${arch}.tar.gz" day
          done
          ls -l dist
      - uses: softprops/action-gh-release@v2.2.1
        with:
          files: dist/*.tar.gz
